<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Trevor's Academy: narrated cram courses, practice sets and timed practice exams.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="styles.css?v=e25fad36b852">
<script>
  // apply the saved theme before first paint
  // light by default; "dark" or "auto" (follow device) only if the user picked it in Settings
  document.documentElement.dataset.theme = 'light';
  try { const t = JSON.parse(localStorage.getItem('ta:settings') || '{}').theme; if (t === 'dark') document.documentElement.dataset.theme = t; else if (t === 'auto' && JSON.parse(localStorage.getItem('ta:settings') || '{}').themeV2) delete document.documentElement.dataset.theme; } catch (e) {}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script type="module" src="app.js?v=e25fad36b852"></script>
</head>
<body>
<div id="app"><div class="boot"><div class="spinner"></div></div></div>
<noscript>Trevor's Academy needs JavaScript enabled.</noscript>
</body>
</html>
